name: staff_attendance
description: "Staff attendance — ESP32 BLE beacon + live face verification (PS 23 Smart Campus)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # Backend + auth
  dio: ^5.11.1
  supabase_flutter: ^2.18.2

  # BLE beacon — pinned to the last BSD-3 release (2.x uses a commercial licence
  # and build-time telemetry). Same version the student app used.
  flutter_blue_plus: 1.36.8
  permission_handler: ^13.0.2

  # Device binding
  device_info_plus: ^13.3.0
  android_id: ^0.6.0
  crypto: ^3.0.7
  package_info_plus: ^10.2.2

  # Live camera + on-device face recognition (no gallery access anywhere)
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1
  tflite_flutter: ^0.12.1
  image: ^4.10.1

  # Campus geofence
  geolocator: ^14.1.1

  # UI / utilities
  google_fonts: ^9.0.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
