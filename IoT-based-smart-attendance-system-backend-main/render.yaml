# ============================================================
# Render Blueprint — Smart Campus Attendance API
# ============================================================
# Docs: https://render.com/docs/blueprint-spec
#
# How to use:
#   1. Push this file to your GitHub repo (inside backend/)
#   2. In Render dashboard → New → Blueprint → select this repo
#   3. Render will create the service automatically.
#
#   OR create the service manually via the dashboard and use
#   this file as reference for settings.
# ============================================================

services:
  - type: web
    name: smart-campus-attendance-api
    runtime: docker
    # Render looks for Dockerfile in the repo root by default.
    # Since our Dockerfile is inside backend/, set rootDir.
    rootDir: backend
    dockerfilePath: ./Dockerfile

    # ── Render instance ──────────────────────────────────────
    # "free" spins down after 15 min of inactivity (cold starts).
    # Change to "starter" ($7/mo) for always-on.
    plan: free
    region: singapore   # Change to: oregon, frankfurt, ohio, virginia

    # ── Health check ─────────────────────────────────────────
    # Render polls this endpoint. Must return 2xx.
    healthCheckPath: /health

    # ── Environment variables ─────────────────────────────────
    # Values marked sync: false must be set manually in the
    # Render dashboard (they contain secrets).
    # Values with a `value:` key are safe defaults.
    envVars:
      # ── Supabase (set these in dashboard — they are secrets) ──
      - key: SUPABASE_URL
        sync: false   # Set manually in Render dashboard

      - key: SUPABASE_SERVICE_KEY
        sync: false   # Set manually in Render dashboard

      - key: SUPABASE_ANON_KEY
        sync: false   # Set manually in Render dashboard

      - key: JWT_SECRET
        sync: false   # Set manually in Render dashboard

      # ── FastAPI ───────────────────────────────────────────────
      - key: DEBUG
        value: "false"

      - key: ALLOWED_ORIGINS
        value: "*"    # Allows Flutter app from any origin.
                      # Restrict to your domain later if needed.

      # ── MQTT (HiveMQ Cloud — TLS port 8883) ─────────────────────
      # publisher.py calls tls_set() automatically when port == 8883.
      # Set MQTT_USERNAME and MQTT_PASSWORD as secrets in the Render dashboard.
      - key: MQTT_BROKER
        value: "dce0dc24b166462e8ddabb14da31c6d0.s1.eu.hivemq.cloud"

      - key: MQTT_PORT
        value: "8883"

      - key: MQTT_USERNAME
        sync: false   # Set in Render dashboard — do not hard-code credentials

      - key: MQTT_PASSWORD
        sync: false   # Set in Render dashboard
