; ============================================================================
; Smart Campus Attendance — ESP32 BLE Broadcaster v3.1.1
; PlatformIO Project Configuration
;
; Protocol V3 + MQTT firmware (firmware/src/)
;
; Key changes from v3.0.0 (BLE range optimization):
;   - BLE advertising interval: 100–200 ms → fixed 100 ms (no jitter)
;   - Wi-Fi coexistence: esp_wifi_set_ps(WIFI_PS_NONE) disables DTIM modem sleep
;   - Modem sleep: esp_wifi_set_ps(WIFI_PS_NONE) after connection
;   - Advertising restart: delay(10) → yield() → ~10 ms blackout reduction
;   - Structured diagnostic INFO logs for all BLE/WiFi events
;   - Long Range PHY: NOT supported on ESP32 BLE 4.2 (see ble_manager.cpp)
;   - REMOVED: esp_coex_preference_set() — deprecated API, caused boot abort()
;             inside coex_core_enable() via esp_bt_controller_enable()
;   - REMOVED: CONFIG_ESP32_WIFI_SW_COEXIST_ENABLE=1 build flag — already
;             defined in framework sdkconfig.h; redefining corrupted glue code
;             conditional-compilation paths (esp32-hal-bt.c, WiFi.cpp adapter)
;
; Key changes from v2.0.0:
;   - Added h2zero/NimBLE-Arduino @ ^2.5.0 (replaces built-in BLE Arduino)
;   - NimBLE provides setConnectableMode() API used in ble_manager.cpp
;   - PubSubClient + ArduinoJson retained (MQTT + JSON parsing unchanged)
;   - MQTT_BUFFER_SIZE bumped to 512 bytes (UUID payloads are larger)
; ============================================================================

[env:esp32dev]
platform = espressif32
board    = esp32dev
framework = arduino
monitor_speed = 115200

; ── Libraries ────────────────────────────────────────────────────────────────
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson  @ ^7.0
    h2zero/NimBLE-Arduino  @ ^2.5.0

; ── Build flags ─────────────────────────────────────────────────────────────────────────────
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ESP_TASK_WDT_TIMEOUT_S=30
    ; Disable NimBLE server/client features — this device is advertise-only.
    ; Reduces flash usage by ~30 KB.
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED=1
    ; NOTE: CONFIG_ESP32_WIFI_SW_COEXIST_ENABLE is intentionally NOT set here.
    ; It is already defined as 1 in the pre-compiled framework sdkconfig.h
    ; (framework-arduinoespressif32 @ 3.20017.241212, sdkconfig.h line 354).
    ; Redefining it via -D causes a redefinition conflict in source-compiled
    ; glue code (esp32-hal-bt.c, WiFi.cpp adapter layer) that interfaces with
    ; the pre-compiled libbt.a / libcoexist.a binaries, corrupting the
    ; coexistence module init state and causing abort() in coex_core_enable()
    ; during esp_bt_controller_enable() inside NimBLEDevice::init().

; ── Upload ────────────────────────────────────────────────────────────────────
upload_speed = 921600

; ── Monitor ──────────────────────────────────────────────────────────────────
monitor_filters = esp32_exception_decoder
