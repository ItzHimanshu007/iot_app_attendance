; =============================================================================
; Staff Attendance — ESP32 BLE beacon (self-generated rotating tokens)
; =============================================================================
; Build & flash:   pio run -t upload && pio device monitor
; Arduino IDE:     open staff_beacon/staff_beacon.ino (install "NimBLE-Arduino")
;
; Before building: copy staff_beacon/secrets.example.h → staff_beacon/secrets.h
;                  and paste the values from Admin → Beacons → (beacon) → Firmware.
; =============================================================================

[platformio]
src_dir = staff_beacon

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
monitor_filters = esp32_exception_decoder

lib_deps =
    h2zero/NimBLE-Arduino @ ^2.5.0

build_flags =
    -D CORE_DEBUG_LEVEL=1
    ; Advertise-only device: drop the unused NimBLE roles (~30 KB flash).
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED=1
